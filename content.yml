# Course content manifest — quant-ai
# Items resolve from the canonical repo (../teaching-content);
# 'course/...' items are course-owned files in this repo's course/ dir.
# After ANY canonical change: push canonical, then `make pin` here —
# CI builds at content_sha, not canonical HEAD (see shell/CLAUDE.md).
#
# The items below are the full ported page set for both modules, listed in
# reading order. The sidebar's six-group structure per part is applied after
# assembly by scripts/restructure_toc.py, which reads its grouping from an
# explicit table rather than from this file's order — so this manifest selects
# pages, and that script arranges them. The two must agree on the page set:
# restructure_toc.py fails the build if they diverge in either direction.

